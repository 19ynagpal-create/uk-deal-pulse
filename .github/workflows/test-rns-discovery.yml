name: Test RNS Discovery

on:
  workflow_dispatch:

jobs:
  test-rns:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Test Ticker RNS discovery
        env:
          TICKER_API_KEY: ${{ secrets.TICKER_API_KEY }}
        run: python src/rns_discovery.py
